# Site
name: "merveylcu"
title: "merveylcu"
description: "Mobile developer building apps for Android & iOS."
logo: 'assets/images/ic_app_logo.webp'
favicon: 'assets/images/ic_app_logo.webp'
url: "https://merveylcu.github.io"   # absolute og:image URLs in link previews
baseurl: ''
google_analytics: ''
disqus: ''
mailchimp-list: ''
include: ["_pages", ".well-known"]
permalink: /:title/

# Authors
authors:
  merve:
    name: Merve Pekyürek
    display_name: Merve Pekyürek
    email: flipwordy@gmail.com
    description: "Developer of FlipWordy, an English vocabulary learning app."

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-archives
    
# Archives
jekyll-archives:
  enabled:
    - categories
  layout: archive
  permalinks:
    category: '/category/:name/'
    
# Pagination 
paginate: 6
paginate_path: /page:num/
    
# Other
markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# Adsense (change to "enabled" to activate, also your client id and ad slot. Create a new ad unit from your Adsense account to get the slot.)
adsense: "disabled"
adsense-data-ad-client: "ca-pub-3412143450191416"
adsense-data-ad-slot: "1363087678"

# Lazy Images ("enabled" or "disabled")
lazyimages: "disabled"

exclude: [changelog.md, LICENSE.txt, README.md, Gemfile, Gemfile.lock]

# Link previews (og:image / twitter:image via jekyll-seo-tag) show each app's own icon.
defaults:
  - scope:
      path: "_pages/focusling"
    values:
      image: /assets/images/focusling_logo.png
  - scope:
      path: "_pages/dracora"
    values:
      image: /assets/images/dracora_logo.png
